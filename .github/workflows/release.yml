name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set versions from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": "[^"]*"', "`"version`": `"$v`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '(?m)^version = "[^"]*"', "version = `"$v`"" | Set-Content src-tauri/Cargo.toml
          npm version $v --no-git-tag-version --allow-same-version

      # Nightly is required for artifact/bindeps (libobs-recorder's
      # extprocess_recorder). rust-toolchain.toml also pins nightly.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      # build-helper provisions the vendored OBS runtime (DLLs +
      # extprocess_recorder.exe) into src-tauri/libobs during the build; the
      # installer bundles it as a resource.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WoW Recorder ${{ github.ref_name }}"
          releaseBody: |
            Lightweight WoW Mythic+ recorder for Windows (x64). The OBS runtime
            is bundled, so there is nothing else to install, and the app
            auto-updates from this repo's releases.

            **Setting it up**

            1. Download and run `WoW.Recorder_*_x64-setup.exe`. Windows may warn
               about an unknown publisher (the installer isn't code-signed) —
               "More info" → "Run anyway".
            2. In WoW, turn on **advanced combat logging** in the network
               options, and start logging with `/combatlog` each session (or let
               an addon such as the Warcraft Logs client do it). This is what
               emits the Mythic+ start/end events — without it, nothing records.
            3. Open the app. It auto-detects your WoW `Logs` folder; check the
               path it found and set where recordings should go (defaults to
               `Videos\WoW Recorder`). The "Watching combat logs" row turns
               on once it is happy.
            4. With WoW running, press **Test recording**, give it a few
               seconds, then **Stop & save** — that shows what the picture and the
               sound settings actually do, without waiting for a key.
            5. Leave it in the tray; keys are recorded on their own. "Start
               automatically when I log in to Windows" keeps it that way across
               reboots.

            Recordings stay on your own machine; nothing is uploaded.
          releaseDraft: false
          prerelease: false
