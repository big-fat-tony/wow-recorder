[package]
name = "wow-recorder"
version = "0.2.0"
description = "Lightweight WoW Mythic+ / raid recorder"
edition = "2021"
rust-version = "1.80"

[lib]
name = "wow_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Provisions the vendored OBS DLLs + extprocess_recorder.exe into target/<profile>/libobs.
build-helper = { git = "https://github.com/big-fat-tony/libobs-recorder.git" }
libobs-recorder = { git = "https://github.com/big-fat-tony/libobs-recorder.git", artifact = "bin:extprocess_recorder" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt-multi-thread"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
open = "5"
dirs = "5"
rfd = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Real OBS capture backend.
libobs-recorder = { git = "https://github.com/big-fat-tony/libobs-recorder.git" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
