[package]
name = "wow-recorder"
version = "0.1.0"
description = "Lightweight WoW Mythic+ / raid recorder"
edition = "2021"
rust-version = "1.80"

[lib]
name = "wow_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt-multi-thread"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
open = "5"
dirs = "5"

[features]
# Real OBS capture via libobs-recorder is added behind this feature so the core
# (combat-log detection, app, tray) builds and tests without the OBS toolchain.
obs = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
